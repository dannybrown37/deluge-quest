default_install_hook_types: [pre-commit, commit-msg, pre-push]
default_stages: [pre-commit]

repos:
  - repo: local
    hooks:
      - id: changelog-reminder
        name: changelog reminder
        # main is only pushed by `just release`; feature branches are checked against their merge-base
        entry: >-
          bash -c '[ "$(git branch --show-current)" = main ] && exit 0;
          if ! git diff --name-only "$(git merge-base origin/main "${PRE_COMMIT_TO_REF:-HEAD}")" "${PRE_COMMIT_TO_REF:-HEAD}" | grep -q "^web/src/content/changelog/"; then
          echo "⚠  No changelog entry on this branch. Add one in web/src/content/changelog/, or skip with SKIP=changelog-reminder"; exit 1; fi'
        language: system
        stages: [pre-push]
        always_run: true
        pass_filenames: false
        fail_fast: true

  - repo: https://github.com/dannybrown37/git-a-grip
    rev: v0.15.1
    hooks:
      - id: commitizen-early
      - id: block-private-terms
      - id: zizmor
      - id: ruff-check
      - id: ruff-format
      - id: biome
        args: [--dir=web]
        files: ^web/
        exclude: ^web/public/py/

  - repo: https://github.com/commitizen-tools/commitizen
    rev: v4.19.0
    hooks:
      - id: commitizen
        stages: [commit-msg]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-merge-conflict
      - id: check-added-large-files
        args: ["--maxkb=1024"]
        exclude: '^web/public/audio/'

  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/scop/pre-commit-shfmt
    rev: v3.14.1-1
    hooks:
      - id: shfmt
