name: Publish to PyPI

on:
  push:
    tags:
      - "v*"

permissions: {}

jobs:
  check:
    uses: $/.github/workflows/check.yml
    permissions:
      contents: read

  publish:
    needs: check
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@v10.2.0
        with:
          python-version: "3.11"

      - run: uv build

      - uses: pypa/gh-action-pypi-publish@v1.14.2
