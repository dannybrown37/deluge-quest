[package]
name = "deluge-clean"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "deluge-clean"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
quick-xml = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
walkdir = "2"

[dev-dependencies]
tempfile = "3"
