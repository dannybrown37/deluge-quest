[project]
name = "deluge-tools"
version = "0.1.0"
description = "Utilities for Synthstrom Deluge song files"
requires-python = ">=3.11"
dependencies = [
    "mido>=1.3,<2",
    "music21>=9.1,<11",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "pyright>=1.1",
]

[project.scripts]
deluge-score = "deluge_tools.cli:main"
deluge-import = "deluge_tools.cli_import:main"
deluge-stats = "deluge_tools.cli_stats:main"
deluge-clean = "deluge_tools.cli_clean:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["no_parse_patch: skip the autouse parse_song patch fixture in test_cli.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pyright]
include = ["deluge_tools", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
