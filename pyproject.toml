[project]
name = "deluge-quest"
version = "0.1.0"
description = "Utilities for Synthstrom Deluge song files"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
score = ["music21>=9.1,<11"]
midi = ["mido>=1.3,<2"]
all = ["deluge-quest[score,midi]"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-xdist>=3.6",
    "ruff>=0.16",
    "pyright>=1.1",
    "commitizen>=4.6",
]

[project.scripts]
deluge-quest = "deluge_tools.cli_quest:main"
deluge-score = "deluge_tools.cli:main"
deluge-import = "deluge_tools.cli_import:main"
deluge-stats = "deluge_tools.cli_stats:main"
deluge-clean = "deluge_tools.cli_clean:main"
deluge-backup = "deluge_tools.cli_backup:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["deluge_tools"]

[tool.hatch.build.targets.sdist]
include = ["deluge_tools", "tests", "pyproject.toml", "LICENSE"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-n auto"
markers = ["no_parse_patch: skip the autouse parse_song patch fixture in test_cli.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
tag_format = "v$version"
version_files = ["pyproject.toml:^version"]
update_changelog_on_bump = true

[tool.pyright]
include = ["deluge_tools", "tests"]
typeCheckingMode = "basic"
pythonVersion = "3.11"
